[project]
name = "eastroom"
version = "0.3.0"
description = "Read whole books in the author's own words, paced for a restless mind. Runs on your computer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY.md", "eastroom/web/fonts/OFL-*.txt", "eastroom/web/fonts/LICENSE-*.txt", "eastroom/web/vendor/pretext/LICENSE", "eastroom/web/vendor/LICENSE-lenis.txt"]
requires-python = ">=3.11"
authors = [{ name = "Intesar Jawad" }]
dependencies = []
keywords = ["reading", "epub", "adhd", "ebook-reader", "focus"]
classifiers = [
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]

[project.optional-dependencies]
voice = ["kokoro-onnx>=0.4", "numpy"]          # the plain narrator: any computer
storyteller = ["mlx-audio", "numpy"]           # the storyteller: Apple chips only
pdf = ["pypdfium2>=5", "pillow"]               # reading PDF files

[project.scripts]
eastroom = "eastroom.__main__:main"

[project.urls]
Homepage = "https://github.com/intesarjawad/eastroom"
Issues = "https://github.com/intesarjawad/eastroom/issues"
Changelog = "https://github.com/intesarjawad/eastroom/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "ruff==0.17.5",
  "pyright==1.1.414",
  "pillow>=11",  # tools/: the icons and the room's pictures
  "numpy>=2,<2.3",  # later stubs need Python 3.12, and the checks run at 3.11
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eastroom"]

[tool.hatch.build.targets.sdist]
include = ["eastroom", "tests", "docs/setup.md", "README.md", "LICENSE", "THIRD-PARTY.md", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy", "voices", "trials", "journey", "review", "app", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PTH", "RUF"]
ignore = ["RUF001", "RUF003"]  # curly quotes and dashes in strings and comments are the books' own typography

[tool.pyright]
include = ["eastroom", "tools"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportMissingImports = false  # the narration and PDF extras are optional and absent from the dev environment
